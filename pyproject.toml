[project]
name = "kiteserve"
version = "0.1.0"
description = "A small LLM inference engine for Qwen3: paged KV cache, continuous batching, recompute preemption"
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=2.4.0",
    "safetensors>=0.8.0",
    "torch>=2.15.0",
    "transformers>=5.22.2",
]

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
